project_id = "draftly"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Your Nekora confirmation code"
content_path = "./supabase/templates/confirmation.html"

[functions.improve-writing]
# The handler validates the user with Auth and checks database permissions itself.
verify_jwt = false
